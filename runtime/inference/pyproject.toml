[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "aa-inference"
version = "0.1.0"
description = "aa-inference: decode a prompt and route it to the appropriate local or cloud model under budget and approval."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Proprietary" }
dependencies = [
    "pydantic>=2.6",
    "httpx>=0.27",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
    "mypy>=1.10",
    "ruff>=0.5",
]
build = [
    "build>=1.2",
]

[project.scripts]
aa-inference = "aa_inference.cli.main:main"

[tool.hatch.build.targets.wheel]
packages = ["src/aa_inference"]

# ---------------------------------------------------------------------------
# pytest
# ---------------------------------------------------------------------------
[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q --strict-markers -m \"not live and not slow\""
markers = [
    "unit: fast, isolated tests with no external dependencies",
    "integration: end-to-end workflows using deterministic fake providers",
    "contract: provider behavioral contract tests",
    "smoke: built-artifact and CLI smoke tests",
    "live: requires real external provider credentials (never run in normal CI)",
    "slow: long-running tests",
]

# ---------------------------------------------------------------------------
# coverage
# ---------------------------------------------------------------------------
[tool.coverage.run]
source = ["src/aa_inference"]
branch = true
omit = [
    "src/aa_inference/__init__.py",
    "src/aa_inference/*/__init__.py",
    "src/aa_inference/history/store.py",
]

[tool.coverage.report]
show_missing = true
skip_covered = true
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
]

# ---------------------------------------------------------------------------
# ruff
# ---------------------------------------------------------------------------
[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]
extend-exclude = ["build", "dist"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "C4"]
ignore = ["B008", "E501"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["B011"]

# ---------------------------------------------------------------------------
# mypy
# ---------------------------------------------------------------------------
[tool.mypy]
python_version = "3.12"
files = ["src/aa_inference"]
ignore_missing_imports = true
check_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
