# Review engine configuration for the aa repository.
#
# Phase and integration PRs regularly touch more than the default 60-file
# review budget. Keep the coverage gate strict while allowing the complete diff
# to be reviewed instead of silently truncating it.
#
# deepseek-flash is evaluated with response_format disabled; keep the provider
# in that mode so the semantic parser receives plain JSON text.
provider:
  supportsJsonFormat: false

review:
  maxFiles: 250
  maxFileBytes: 500000
  # Keep each semantic request small enough for deepseek-flash to return
  # complete, bounded JSON. The automatic defaults are 25 files / 150000 bytes.
  maxBatchFiles: 10
  maxBatchBytes: 60000
  coverageThreshold: 1.0
  blockThreshold: P1
