[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "aa-sifter"
version = "0.1.0"
description = "aa-sifter: decode a prompt and route it to the appropriate local or cloud model under budget and approval."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Proprietary" }
dependencies = [
    "pydantic>=2.6",
    "httpx>=0.27",
    "python-dotenv>=1.0",
]

[project.scripts]
aa-sifter = "aa_sifter.cli.main:main"

[tool.hatch.build.targets.wheel]
packages = ["src/aa_sifter"]
