name: Bug report
description: Something is broken or behaves differently than documented.
title: "bug: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Use this form for reproducible defects. For security issues, do not file a public issue; contact the maintainer privately.
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What is wrong?
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction
      description: Exact commands, inputs, and environment.
      placeholder: |
        1. ...
        2. ...
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Evidence
      description: Logs, traces, failing tests, screenshots, or links.
  - type: input
    id: area
    attributes:
      label: Suspected area
      placeholder: module/package or control-plane route
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      value: |
        - [ ] root cause understood
        - [ ] behavior corrected
        - [ ] regression test added where practical
        - [ ] related tests pass
    validations:
      required: true
  - type: dropdown
    id: severity
    attributes:
      label: Severity
      options: [P0, P1, P2, P3]
    validations:
      required: true
