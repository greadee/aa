# Review engine (revu) v1.2.0 — Shape A: single-file, trusted PR review.
#
# Runs on same-repository pull requests. When REVU_PROVIDER_API_KEY is set the
# semantic pass queries DeepSeek V4.1 Flash through OpenRouter; otherwise it
# falls back to the static-only review so the gate stays green without a key.
# For untrusted forks, use the two-file collect/finalize pattern instead.
name: revu

on:
  pull_request:
    branches: [main]
    paths-ignore:
      - '.github/workflows/revu.yml' 
  workflow_dispatch:
    inputs:
      pr:
        description: "Pull request number to review"
        required: true
        type: number
      closeout:
        description: "Post a new closeout review comment instead of updating the existing revu comment"
        required: false
        type: boolean
        default: false

permissions:
  contents: write
  pull-requests: write
  issues: write

concurrency:
  group: revu-${{ github.event.pull_request.number || inputs.pr || github.ref }}
  cancel-in-progress: true

jobs:
  review:
    name: revu (pr review)
    if: github.event_name == 'pull_request' || inputs.pr != ''
    runs-on: ubuntu-latest
    env:
      GITHUB_TOKEN: ${{ secrets.REVU_GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Preflight provider
        if: ${{ inputs.closeout == true }}
        env:
          KEY: ${{ secrets.REVU_PROVIDER_API_KEY }}
        run: |
          set -euo pipefail
          echo "key length: ${#KEY}"
          curl -sS --max-time 30 -o /tmp/dsmodels.json -w "deepseek models HTTP %{http_code}\n" \
            https://api.deepseek.com/models -H "Authorization: Bearer $KEY"
          cat /tmp/dsmodels.json; echo
          curl -sS --max-time 60 -o /tmp/dschat.json -w "deepseek chat HTTP %{http_code}\n" \
            https://api.deepseek.com/v1/chat/completions \
            -H "Authorization: Bearer $KEY" -H 'Content-Type: application/json' \
            -d '{"model":"deepseek-flash","messages":[{"role":"user","content":"Reply with the single word ok"}],"max_tokens":8}'
          cat /tmp/dschat.json; echo
      - id: revu
        uses: greadee/review-engine@v1.2.0
        with:
          profile: pr
          semantic: ${{ secrets.REVU_PROVIDER_API_KEY != '' }}
          provider: openai-compatible
          model: deepseek-flash
          base-url: https://api.deepseek.com/v1
          allowed-base-urls: https://api.deepseek.com/v1
          api-key: ${{ secrets.REVU_PROVIDER_API_KEY }}
          base: origin/${{ github.base_ref || 'main' }}
          head: ${{ github.event.pull_request.head.sha || github.sha }}
          pr: ${{ github.event.pull_request.number || inputs.pr }}
          repository: ${{ github.repository }}
          publish: "true"
          comment: ${{ inputs.closeout == true && 'false' || 'true' }}
          block: "true"
      - name: Post closeout review comment
        if: ${{ always() && inputs.closeout == true }}
        env:
          GH_TOKEN: ${{ github.token }}
          SUMMARY: ${{ steps.revu.outputs.summary }}
          PR: ${{ github.event.pull_request.number || inputs.pr }}
        run: |
          set -euo pipefail
          if [ ! -f "$SUMMARY" ]; then
            echo "revu summary was not produced"
            exit 1
          fi
          {
            echo "## Sprint closeout review"
            echo
            echo "_Model: \`DeepSeek-V4.1-Flash\` (deepseek-flash) via the DeepSeek API._"
            echo
            cat "$SUMMARY"
          } > /tmp/revu-closeout.md
          gh pr comment "$PR" --repo "${{ github.repository }}" --body-file /tmp/revu-closeout.md
