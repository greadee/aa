# Review engine (revu) — Shape A: single-file, trusted PR review.
#
# Runs on same-repository pull requests. When REVU_PROVIDER_API_KEY is set the
# semantic pass queries DeepSeek V4.1 Flash through OpenRouter; otherwise it
# falls back to the static-only review so the gate stays green without a key.
# For untrusted forks, use the two-file collect/finalize pattern instead.
name: revu

on:
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      pr:
        description: "Pull request number to review"
        required: true
        type: number

permissions:
  contents: write
  pull-requests: write
  issues: write

concurrency:
  group: revu-${{ github.event.pull_request.number || inputs.pr || github.ref }}
  cancel-in-progress: true

jobs:
  review:
    name: revu (pr review)
    if: github.event_name == 'pull_request' || inputs.pr != ''
    runs-on: ubuntu-latest
    env:
      GITHUB_TOKEN: ${{ secrets.REVU_GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: greadee/review-engine@v1
        with:
          profile: pr
          semantic: ${{ secrets.REVU_PROVIDER_API_KEY != '' }}
          provider: openai-compatible
          model: deepseek/deepseek-v4.1-flash
          base-url: https://openrouter.ai/api/v1
          allowed-base-urls: https://openrouter.ai/api/v1
          api-key: ${{ secrets.REVU_PROVIDER_API_KEY }}
          base: origin/${{ github.base_ref || 'main' }}
          head: ${{ github.event.pull_request.head.sha || github.sha }}
          pr: ${{ github.event.pull_request.number || inputs.pr }}
          repository: ${{ github.repository }}
          publish: "true"
          comment: "true"
          block: "true"
