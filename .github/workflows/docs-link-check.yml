name: Docs Link Check

on:
  push:
    branches:
      - main
      - "ph*"
    paths:
      - "**/*.md"
      - "docs/**"
  pull_request:
    paths:
      - "**/*.md"
      - "docs/**"

permissions:
  contents: read

jobs:
  link-check:
    name: markdown links
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check links
        uses: lycheeverse/lychee-action@v2
        with:
          args: >-
            --no-progress
            --offline
            --include-fragments
            "./**/*.md"
          fail: true
