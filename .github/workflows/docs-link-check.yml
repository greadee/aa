name: Docs Link Check

on:
  push:
    branches:
      - main
      - dev
    paths:
      - "**/*.md"
      - "docs/**"
  pull_request:
    paths:
      - "**/*.md"
      - "docs/**"

permissions:
  contents: read

jobs:
  link-check:
    name: markdown links
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # External URLs are intentionally unchecked here (offline); add a scheduled
      # online run if external link rot becomes a maintenance concern.
      - name: Check links
        uses: lycheeverse/lychee-action@v2
        with:
          args: >-
            --no-progress
            --offline
            --include-fragments
            "./**/*.md"
          fail: true

      - name: Check media references
        run: python3 tools/docs/check_media.py

      - name: Check local links and anchors
        run: python3 tools/docs/check_links.py

      - name: Validate issue and PR templates
        run: |
          python3 -m pip install --quiet pyyaml
          python3 tools/docs/check_templates.py
