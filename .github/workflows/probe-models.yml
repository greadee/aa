name: probe-models
on: workflow_dispatch
permissions:
  contents: read
  models: read
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Probe GitHub Models
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          echo "== catalog =="
          curl -sS --max-time 30 https://models.github.ai/catalog/models \
            -H "Authorization: Bearer $GITHUB_TOKEN" -o catalog.json
          python3 - <<'PY'
          import json
          try:
              data=json.load(open('catalog.json'))
          except Exception as e:
              print('catalog parse error:', e)
              print(open('catalog.json').read()[:1000])
              raise SystemExit(0)
          rows=data if isinstance(data,list) else data.get('data',[])
          for m in rows:
              mid=m.get('id') or m.get('name') or ''
              if 'deepseek' in mid.lower() or 'flash' in mid.lower():
                  print(mid)
          print('total', len(rows))
          PY
          echo "== inference =="
          curl -sS --max-time 45 https://models.github.ai/inference/chat/completions \
            -H "Authorization: Bearer $GITHUB_TOKEN" -H 'Content-Type: application/json' \
            -d '{"model":"deepseek/DeepSeek-V3-0324","messages":[{"role":"user","content":"Reply with the single word ok"}],"max_tokens":8}' \
            -w '\nHTTP %{http_code}\n'
