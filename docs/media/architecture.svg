<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="820" viewBox="0 0 1200 820" role="img" aria-labelledby="title desc">
  <title id="title">aa v1 current composition</title>
  <desc id="desc">As-built composition: console surfaces call the app control plane; the app composes kernel, runtime, memory, observation, visualizer, registry, toolbox, forge, and sync through contracts v2.</desc>
  <rect width="1200" height="820" fill="#0b0f14"/>
  <g font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Helvetica, Arial, sans-serif">
    <text x="40" y="52" fill="#e6edf3" font-size="28" font-weight="700">aa v1 — current composition</text>
    <text x="40" y="78" fill="#9da7b3" font-size="15">As built in app/main.go. Contracts v2 is the boundary for every module.</text>

    <rect x="40" y="110" width="240" height="110" rx="10" fill="#161b22" stroke="#3fb950"/>
    <text x="60" y="142" fill="#7ee787" font-size="17" font-weight="600">ui console</text>
    <text x="60" y="168" fill="#9da7b3" font-size="14">CLI · TUI · read-only web</text>
    <text x="60" y="190" fill="#9da7b3" font-size="14">fake client for offline use</text>

    <rect x="360" y="110" width="320" height="110" rx="10" fill="#161b22" stroke="#58a6ff"/>
    <text x="380" y="142" fill="#58a6ff" font-size="17" font-weight="600">app — composition root + daemon</text>
    <text x="380" y="168" fill="#9da7b3" font-size="14">loopback HTTP/JSON control plane</text>
    <text x="380" y="190" fill="#9da7b3" font-size="14">project state · observation · sync · visualizer planes</text>

    <rect x="760" y="110" width="400" height="110" rx="10" fill="#161b22" stroke="#d29922"/>
    <text x="780" y="142" fill="#d29922" font-size="17" font-weight="600">contracts v2</text>
    <text x="780" y="168" fill="#9da7b3" font-size="14">JSON Schema · OpenAPI · RPC shapes</text>
    <text x="780" y="190" fill="#9da7b3" font-size="14">generated Go / TypeScript / Python</text>

    <rect x="40" y="300" width="250" height="150" rx="10" fill="#161b22" stroke="#bc8cff"/>
    <text x="60" y="332" fill="#bc8cff" font-size="17" font-weight="600">kernel</text>
    <text x="60" y="358" fill="#9da7b3" font-size="14">allocator · planner · scheduler</text>
    <text x="60" y="380" fill="#9da7b3" font-size="14">gates · context · joblearn</text>
    <text x="60" y="402" fill="#9da7b3" font-size="14">observability</text>

    <rect x="330" y="300" width="250" height="150" rx="10" fill="#161b22" stroke="#ffa657"/>
    <text x="350" y="332" fill="#ffa657" font-size="17" font-weight="600">runtime</text>
    <text x="350" y="358" fill="#9da7b3" font-size="14">worker · sandbox · intake</text>
    <text x="350" y="380" fill="#9da7b3" font-size="14">lifecycle</text>
    <text x="350" y="402" fill="#9da7b3" font-size="14">inference sidecar (optional)</text>

    <rect x="620" y="300" width="250" height="150" rx="10" fill="#161b22" stroke="#79c0ff"/>
    <text x="640" y="332" fill="#79c0ff" font-size="17" font-weight="600">knowledge</text>
    <text x="640" y="358" fill="#9da7b3" font-size="14">memory: records · retrieval</text>
    <text x="640" y="380" fill="#9da7b3" font-size="14">obsv: journal · reports</text>
    <text x="640" y="402" fill="#9da7b3" font-size="14">visualizer: replay · layout</text>

    <rect x="910" y="300" width="250" height="150" rx="10" fill="#161b22" stroke="#3fb950"/>
    <text x="930" y="332" fill="#7ee787" font-size="17" font-weight="600">world adapters</text>
    <text x="930" y="358" fill="#9da7b3" font-size="14">forge: git / GitHub lifecycle</text>
    <text x="930" y="380" fill="#9da7b3" font-size="14">sync: single-node fabric in v1</text>
    <text x="930" y="402" fill="#9da7b3" font-size="14">toolbox: tools · policy · flows</text>

    <rect x="40" y="520" width="1120" height="120" rx="10" fill="#161b22" stroke="#30363d"/>
    <text x="60" y="552" fill="#e6edf3" font-size="17" font-weight="600">registry — durable definitions</text>
    <text x="60" y="578" fill="#9da7b3" font-size="14">roles · models · teams · routines · policies · capabilities (definitions only; no runtime instances)</text>
    <text x="60" y="604" fill="#9da7b3" font-size="14">kernel consumes definitions; the control plane serves registry reads; state persists through memory.</text>

    <g stroke="#8b949e" stroke-width="2" fill="none">
      <path d="M280 165 H360"/>
      <path d="M680 165 H760"/>
      <path d="M520 220 V300"/>
      <path d="M165 300 V220"/>
      <path d="M455 300 V220"/>
      <path d="M745 300 V220"/>
      <path d="M1035 300 V220"/>
      <path d="M165 450 V520"/>
      <path d="M455 450 V520"/>
      <path d="M745 450 V520"/>
      <path d="M1035 450 V520"/>
    </g>
    <g fill="#8b949e" font-size="12" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">
      <text x="40" y="690">Read: console → app daemon → project state/read models.</text>
      <text x="40" y="712">Write: app → project state → memory; scheduler dispatches through runtime; results return through intake.</text>
      <text x="40" y="734">Observation flows into memory and visualization; forge/sync/toolbox remain adapters and never own execution authority.</text>
      <text x="40" y="772" fill="#7ee787">Full maps: docs/architecture/diagrams.md</text>
    </g>
  </g>
</svg>
