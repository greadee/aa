<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="720" viewBox="0 0 1100 720" role="img" aria-labelledby="title desc">
  <title id="title">aa console — read-only web surface</title>
  <desc id="desc">Content capture of the deterministic read-only web console served by aa console --web against the local control plane.</desc>
  <rect width="1100" height="720" fill="#0b0f14"/>
  <rect x="0" y="0" width="1100" height="44" fill="#161b22"/>
  <circle cx="24" cy="22" r="6" fill="#ff7b72"/>
  <circle cx="44" cy="22" r="6" fill="#d29922"/>
  <circle cx="64" cy="22" r="6" fill="#3fb950"/>
  <text x="88" y="28" fill="#9da7b3" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13">127.0.0.1:7101 — aa console</text>
  <g font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Helvetica, Arial, sans-serif">
    <text x="40" y="96" fill="#e6edf3" font-size="28" font-weight="700">aa console</text>
    <text x="40" y="126" fill="#7ee787" font-size="14">projects=1   nodes=1   active_assignments=0</text>
    <text x="40" y="176" fill="#e6edf3" font-size="20" font-weight="600">Projects</text>
    <text x="40" y="204" fill="#9da7b3" font-size="16">default — Default</text>
    <text x="40" y="252" fill="#e6edf3" font-size="20" font-weight="600">Work (default)</text>
    <text x="40" y="280" fill="#9da7b3" font-size="16">(none)</text>
    <text x="40" y="328" fill="#e6edf3" font-size="20" font-weight="600">Nodes</text>
    <text x="40" y="356" fill="#9da7b3" font-size="16">c2111f2396123d73 — ready</text>
    <text x="40" y="404" fill="#e6edf3" font-size="20" font-weight="600">Tools</text>
    <text x="40" y="432" fill="#9da7b3" font-size="16">tool_screen (builtin)</text>
  </g>
  <rect x="40" y="500" width="1020" height="1" fill="#30363d"/>
  <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13" fill="#9da7b3">
    <text x="40" y="536">Captured from:</text>
    <text x="40" y="560" fill="#7ee787">aa console --web --control http://127.0.0.1:7100/api/v1 --token &lt;token&gt;</text>
    <text x="40" y="592">This is a content capture of the deterministic fake/read-only surface, not a photograph.</text>
    <text x="40" y="616">Replace with an owner browser screenshot when one is available.</text>
  </g>
</svg>
